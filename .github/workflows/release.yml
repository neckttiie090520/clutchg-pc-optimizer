# ============================================================
# ClutchG PC Optimizer — fail-closed release pipeline
# ============================================================

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Sign, and Release (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      EXPECTED_PUBLISHER: CN=ClutchG Project
      SIGNING_CERTIFICATE_PATH: ${{ runner.temp }}\clutchg-signing.pfx

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            clutchg/requirements.txt
            clutchg/requirements-test.txt

      - name: Validate tag and version parity
        id: identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Release tag must be exactly vMAJOR.MINOR.PATCH: $tag"
          }
          $version = $Matches[1]

          $versionPy = Get-Content 'clutchg/src/version.py' -Raw
          if ($versionPy -notmatch '__version__\s*=\s*"(\d+\.\d+\.\d+)"') {
            throw 'Could not read clutchg/src/version.py version'
          }
          $pythonVersion = $Matches[1]

          $iss = Get-Content 'clutchg/installer/ClutchG.iss' -Raw
          if ($iss -notmatch '(?m)^#define AppVersion\s+"(\d+\.\d+\.\d+)"\s*$') {
            throw 'Could not read installer AppVersion'
          }
          $installerVersion = $Matches[1]

          $versionInfo = Get-Content 'clutchg/version_info.txt' -Raw
          if ($versionInfo -notmatch "StringStruct\(u'FileVersion',\s+u'(\d+\.\d+\.\d+)'\)") {
            throw 'Could not read PE FileVersion'
          }
          $fileVersion = $Matches[1]
          if ($versionInfo -notmatch "StringStruct\(u'ProductVersion',\s+u'(\d+\.\d+\.\d+)'\)") {
            throw 'Could not read PE ProductVersion'
          }
          $productVersion = $Matches[1]

          $versions = @($pythonVersion, $installerVersion, $fileVersion, $productVersion)
          if (@($versions | Where-Object { $_ -ne $version }).Count -ne 0) {
            throw "Version mismatch: tag=$version python=$pythonVersion installer=$installerVersion file=$fileVersion product=$productVersion"
          }

          $installer = "clutchg/installer/output/ClutchG-Setup-$version.exe"
          "version=$version" >> $env:GITHUB_OUTPUT
          "installer=$installer" >> $env:GITHUB_OUTPUT
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          Write-Output "Validated release identity v$version"

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Chocolatey failed to install Inno Setup' }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }

      - name: Install runtime dependencies
        run: pip install -r clutchg/requirements.txt

      - name: Install test dependencies
        run: pip install -r clutchg/requirements-test.txt

      - name: Run tests
        working-directory: clutchg
        run: >
          python -m pytest tests/unit tests/integration
          --skip-slow --skip-e2e
          -q --tb=short

      - name: Build ClutchG.exe
        working-directory: clutchg
        run: python build.py

      - name: Prepare signing certificate
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64)) {
            throw 'WINDOWS_SIGNING_CERTIFICATE_BASE64 is not provisioned'
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)) {
            throw 'WINDOWS_SIGNING_CERTIFICATE_PASSWORD is not provisioned'
          }

          if (Test-Path -LiteralPath $env:SIGNING_CERTIFICATE_PATH) {
            Remove-Item -LiteralPath $env:SIGNING_CERTIFICATE_PATH -Force
          }
          try {
            [IO.File]::WriteAllBytes(
              $env:SIGNING_CERTIFICATE_PATH,
              [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64)
            )
          } catch {
            throw "Signing certificate secret is not valid Base64: $_"
          }

          $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $env:SIGNING_CERTIFICATE_PATH,
            $env:SIGNING_CERTIFICATE_PASSWORD,
            $flags
          )
          if (-not $certificate.HasPrivateKey) { throw 'Signing PFX has no private key' }
          if ($certificate.Subject -ne $env:EXPECTED_PUBLISHER) {
            throw "Signing publisher mismatch: expected '$env:EXPECTED_PUBLISHER', got '$($certificate.Subject)'"
          }

          $kitsRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $signtool = Get-ChildItem $kitsRoot -Filter signtool.exe -Recurse -ErrorAction Stop |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw '64-bit signtool.exe was not found' }

          "SIGNTOOL_PATH=$($signtool.FullName)" >> $env:GITHUB_ENV

      - name: Sign and verify ClutchG.exe
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'clutchg/dist/ClutchG/ClutchG.exe').Path
          $peVersion = (Get-Item $exe).VersionInfo.ProductVersion.Trim()
          if ($peVersion -ne $env:RELEASE_VERSION) {
            throw "ClutchG.exe ProductVersion mismatch: $peVersion"
          }

          & $env:SIGNTOOL_PATH sign /fd SHA256 /td SHA256 /tr 'http://timestamp.digicert.com' /f $env:SIGNING_CERTIFICATE_PATH /p $env:SIGNING_CERTIFICATE_PASSWORD $exe
          if ($LASTEXITCODE -ne 0) { throw 'signtool failed for ClutchG.exe' }

          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
            throw "ClutchG.exe Authenticode status is $($signature.Status)"
          }
          if ($signature.SignerCertificate.Subject -ne $env:EXPECTED_PUBLISHER) {
            throw "ClutchG.exe publisher mismatch: $($signature.SignerCertificate.Subject)"
          }

      - name: Remove app signing material
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath $env:SIGNING_CERTIFICATE_PATH) {
            Remove-Item -LiteralPath $env:SIGNING_CERTIFICATE_PATH -Force
          }

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = 'clutchg/installer/output'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          Get-ChildItem $output -Filter 'ClutchG-Setup-*.exe' -ErrorAction SilentlyContinue | Remove-Item -Force

          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc 'clutchg/installer/ClutchG.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup build failed' }

      - name: Prepare installer signing certificate
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64)) {
            throw 'WINDOWS_SIGNING_CERTIFICATE_BASE64 is not provisioned'
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)) {
            throw 'WINDOWS_SIGNING_CERTIFICATE_PASSWORD is not provisioned'
          }
          if (Test-Path -LiteralPath $env:SIGNING_CERTIFICATE_PATH) {
            Remove-Item -LiteralPath $env:SIGNING_CERTIFICATE_PATH -Force
          }
          try {
            [IO.File]::WriteAllBytes(
              $env:SIGNING_CERTIFICATE_PATH,
              [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64)
            )
          } catch {
            throw "Signing certificate secret is not valid Base64: $_"
          }
          $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $env:SIGNING_CERTIFICATE_PATH,
            $env:SIGNING_CERTIFICATE_PASSWORD,
            $flags
          )
          if (-not $certificate.HasPrivateKey) { throw 'Signing PFX has no private key' }
          if ($certificate.Subject -ne $env:EXPECTED_PUBLISHER) {
            throw "Signing publisher mismatch: expected '$env:EXPECTED_PUBLISHER', got '$($certificate.Subject)'"
          }

      - name: Sign and verify exact installer
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedRelative = '${{ steps.identity.outputs.installer }}'
          $expected = Join-Path $env:GITHUB_WORKSPACE $expectedRelative
          $assets = @(Get-ChildItem 'clutchg/installer/output' -Filter '*.exe' -File)
          if ($assets.Count -ne 1) {
            throw "Expected exactly one installer executable, found $($assets.Count)"
          }
          if ($assets[0].FullName -ne $expected) {
            throw "Unexpected installer asset: $($assets[0].Name)"
          }

          $peVersion = $assets[0].VersionInfo.ProductVersion.Trim()
          if ($peVersion -ne $env:RELEASE_VERSION) {
            throw "Installer ProductVersion mismatch: $peVersion"
          }

          & $env:SIGNTOOL_PATH sign /fd SHA256 /td SHA256 /tr 'http://timestamp.digicert.com' /f $env:SIGNING_CERTIFICATE_PATH /p $env:SIGNING_CERTIFICATE_PASSWORD $expected
          if ($LASTEXITCODE -ne 0) { throw 'signtool failed for installer' }

          $signature = Get-AuthenticodeSignature -LiteralPath $expected
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
            throw "Installer Authenticode status is $($signature.Status)"
          }
          if ($signature.SignerCertificate.Subject -ne $env:EXPECTED_PUBLISHER) {
            throw "Installer publisher mismatch: $($signature.SignerCertificate.Subject)"
          }

      - name: Remove signing material
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath $env:SIGNING_CERTIFICATE_PATH) {
            Remove-Item -LiteralPath $env:SIGNING_CERTIFICATE_PATH -Force
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ClutchG ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.identity.outputs.installer }}
