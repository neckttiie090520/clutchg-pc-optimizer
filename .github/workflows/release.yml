# ============================================================
# ClutchG PC Optimizer — Release Pipeline
# GitHub Actions workflow for building and releasing
# ============================================================
#
# Triggered by version tags (v1.0.0, v1.2.3, etc.)
# Builds ClutchG via PyInstaller, packages as Inno Setup
# installer, and creates a GitHub Release with the installer
# attached as an asset.
#
# The Inno Setup installer is required (not bare .exe) because
# the auto-update relauncher relies on the registry entry
# (HKLM\...\Uninstall\{AppId}_is1\InstallLocation) written by
# Inno Setup to locate the new binary after update.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # ---- Checkout ----
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Python setup ----
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            clutchg/requirements.txt
            clutchg/requirements-test.txt

      # ---- Install Inno Setup ----
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --version=6.4.3 -y --no-progress
          # Verify ISCC is on PATH
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /? 2>&1 | Select-Object -First 1

      # ---- Install dependencies ----
      - name: Install runtime dependencies
        run: pip install -r clutchg/requirements.txt

      - name: Install test dependencies
        run: pip install -r clutchg/requirements-test.txt

      # ---- Run tests before building ----
      - name: Run tests
        working-directory: clutchg
        run: >
          python -m pytest tests/unit tests/integration
          --skip-slow --skip-e2e
          -q --tb=short

      # ---- Build exe via PyInstaller ----
      - name: Build ClutchG.exe (PyInstaller)
        working-directory: clutchg
        run: python build.py

      # ---- Verify PyInstaller output ----
      - name: Verify PyInstaller output
        shell: pwsh
        run: |
          if (Test-Path "clutchg\dist\ClutchG\ClutchG.exe") {
            $size = (Get-Item "clutchg\dist\ClutchG\ClutchG.exe").Length / 1MB
            Write-Output "ClutchG.exe built successfully ($([math]::Round($size, 1)) MB)"
          } else {
            Write-Error "PyInstaller build failed — clutchg\dist\ClutchG\ClutchG.exe not found"
            exit 1
          }

      # ---- Build Inno Setup installer ----
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "clutchg\installer\ClutchG.iss"

      # ---- Verify installer output ----
      - name: Verify installer output
        shell: pwsh
        run: |
          $installer = Get-ChildItem "clutchg\installer\output\ClutchG-Setup-*.exe" | Select-Object -First 1
          if ($installer) {
            $size = $installer.Length / 1MB
            Write-Output "Installer built: $($installer.Name) ($([math]::Round($size, 1)) MB)"
            Write-Output "INSTALLER_PATH=$($installer.FullName)" >> $env:GITHUB_ENV
          } else {
            Write-Error "Inno Setup build failed — no ClutchG-Setup-*.exe found"
            exit 1
          }

      # ---- Create GitHub Release with installer asset ----
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ClutchG ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
          files: clutchg/installer/output/ClutchG-Setup-*.exe
